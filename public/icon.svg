<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Phone Outline -->
  <rect x="136" y="76" width="240" height="360" rx="42" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="12"/>
  
  <!-- Speaker notch -->
  <rect x="226" y="102" width="60" height="8" rx="4" fill="#334155"/>

  <!-- Inner Screen Area -->
  <rect x="156" y="128" width="200" height="256" rx="18" fill="#090d16"/>

  <!-- Central Chip / Component -->
  <rect x="206" y="206" width="100" height="100" rx="20" fill="url(#chipGrad)" opacity="0.9"/>
  <path d="M256 226 L256 286 M226 256 L286 256" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>

  <!-- Circuit traces -->
  <path d="M206 236 L176 236 M206 276 L176 276" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <path d="M306 236 L336 236 M306 276 L336 276" stroke="#06b6d4" stroke-width="6" stroke-linecap="round"/>
  <path d="M236 206 L236 176 M276 206 L276 176" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <path d="M236 306 L236 336 M276 306 L276 336" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>

  <!-- Home indicator line -->
  <line x1="220" y1="410" x2="292" y2="410" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
</svg>
